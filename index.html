<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b0a">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>SmokeLess</title>
<style>
:root{color-scheme:dark;--bg:#050b0a;--card:#0b1311;--btn:#28332d;--ink:#f1f5f2;--mut:#9aa89f;--line:#2f3b35;--acc:#4a7c4f;--hi:#8fd19a;--accink:#fff;--soft:#17261d;--warn:#e0a458;--sh:none;--serif:ui-serif,Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);padding-top:env(safe-area-inset-top)}
main{max-width:520px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font:600 15px var(--sans);margin:0;color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--sh);margin-bottom:14px;border:1px solid var(--line)}
.hero{text-align:center;padding:26px 18px 20px}
.num{font:400 112px/1 var(--serif);letter-spacing:-3px}
.sub{color:var(--mut);margin-top:4px}
.strip{position:relative;height:30px;margin:20px 6px 4px;border-bottom:2px solid var(--line)}
.tick{position:absolute;bottom:0;width:4px;height:22px;border-radius:3px;background:var(--hi);transform:translateX(-2px)}
.tick.b{opacity:.45}
.scale{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin:0 6px}
.log{display:block;width:100%;border:0;border-radius:26px;background:var(--acc);color:var(--accink);font:600 22px var(--sans);padding:26px;margin:4px 0 12px;box-shadow:0 10px 24px -10px var(--acc)}
.log:active{transform:scale(.98)}
.row{display:flex;gap:10px;margin-bottom:14px}
.btn{flex:1;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:16px;padding:14px;font:500 15px var(--sans)}
.btn.p{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.d{color:var(--warn)}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--hi)}
.chip.w{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.cf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.cf .btn{flex:0 0 auto;padding:10px 14px}
.stat{display:flex;justify-content:space-between;padding:8px 0}
.stat b{font-weight:600}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:14px}
input{width:100%;font:16px var(--sans);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:500 14px var(--sans);padding:16px 0}
nav button.on{color:var(--hi);font-weight:700}
dialog{max-height:88vh;overflow:auto;border:0;border-radius:22px;padding:20px;background:var(--card);color:var(--ink);width:min(92vw,400px)}
dialog::backdrop{background:rgba(5,15,20,.55)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:488px;margin:auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:13px 16px;display:flex;justify-content:space-between;gap:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1;pointer-events:auto}
#toast button{background:none;border:0;color:inherit;font:700 15px var(--sans);text-decoration:underline}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--hi)}.hist{display:flex;align-items:flex-end;gap:2px;height:70px;margin-top:12px}.hist i{flex:1;background:var(--hi);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
nav button.dot::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
.hero{transition:background .3s}.st{margin-top:10px;font-weight:600}.hero.g{background:#102a1b;border-color:#3a7d51}.hero.a{background:#2a2111;border-color:#8a6a24}.hero.r{background:#2c1614;border-color:#9a4a42}.stk{display:flex;flex-direction:column;gap:8px;margin-top:12px}.stk .btn{flex:none}
select{width:100%;font:16px var(--sans);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--ink)}
.tap{cursor:pointer}.tap:active{opacity:.85}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chips button{border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:99px;padding:8px 13px;font:14px var(--sans)}.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
[hidden]{display:none!important}
.empty{color:var(--mut);text-align:center;padding:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="top"><h1>SmokeLess</h1><span id="date" class="sub"></span></div>

<section id="v-today">
  <div id="obsc"></div>
  <div id="pend"></div>
  <div class="card hero" id="hero">
    <div class="num" id="cnt">0</div>
    <div class="sub" id="cntsub">cigarettes today</div>
    <div class="st" id="st"></div>
    <div class="sub" id="since"></div>
    <div class="strip" id="strip"></div>
    <div class="scale"><span>4 am</span><span>10 am</span><span>4 pm</span><span>10 pm</span><span>4 am</span></div>
  </div>
  <button class="log" data-a="log">Log cigarette</button>
  <div id="cb" class="card" hidden><b>What was happening?</b><div class="chips" id="cbx"></div><div class="sub" style="margin-top:12px">Mood or urge</div><div class="chips" id="cbm"></div><div class="row" style="margin:12px 0 0"><button class="btn" data-a="cbDone">Done</button></div></div>
  <div class="row">
    <button class="btn" data-a="back">Add missed</button>
    <button class="btn" data-a="undo" id="undo">Undo last</button>
  </div>
  <div class="row"><button class="btn" data-a="crave">Craving resisted <span class="chip" id="crv">0</span></button></div>
  <div class="card list" id="tlist"></div>
</section>

<section id="v-hist" hidden>
  <div class="card" id="gr"></div>
  <div class="card" id="wk" hidden></div>
  <div class="card" id="sum"></div>
  <div class="card" id="pat"></div>
  <div class="card list" id="aj" hidden></div>
  <div class="card list" id="ph" hidden></div>
  <div class="card list" id="hlist"></div>
</section>

<section id="v-set" hidden>
  <div class="card">
    <label>Day starts at (hour, 0 to 8)</label><input id="s-cut" type="number" min="0" max="8">
    <label>Cigarettes per day before you started (estimate)</label><input id="s-base" type="number" min="0">
    <label>Cigarettes per pack</label><input id="s-pack" type="number" min="1">
    <label>Price per pack</label><input id="s-price" type="number" min="0" step="0.01">
    <label>Currency symbol</label><input id="s-cur" maxlength="3">
    <label>Usual wake time (optional)</label><input id="s-wk" type="time">
    <label>Usual sleep time (optional)</label><input id="s-sl" type="time">
  </div>
  <div class="card">
    <b>Backup</b><p class="sub" id="lastexp" style="margin:4px 0 12px"></p>
    <div class="row"><button class="btn" data-a="exp">Export JSON</button><button class="btn" data-a="csv">Export CSV</button></div>
    <button class="btn" style="width:100%" data-a="imp">Restore from backup</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <p class="sub">Your data lives only in this browser on this phone. Export weekly.</p>
    <button class="btn" style="width:100%" data-a="edit">Edit observation, phases and data</button>
  </div>
</section>
</main>

<nav>
  <button class="on" data-t="today">Today</button>
  <button data-t="hist">Days</button>
  <button data-t="set">Settings</button>
</nav>

<div id="toast"><span id="tmsg"></span><button id="tctx" hidden>Context</button><button id="tund" hidden>Undo</button></div>

<dialog id="pdlg"><b id="pt"></b><div id="pb"></div><label>Reason (required)</label><input id="pr" maxlength="80"><div class="sub" id="pe" style="color:var(--warn)"></div><div class="stk" id="pa"></div><div class="stk"><button class="btn" id="px">Close</button></div></dialog>
<dialog id="edlg"><b>Edit records</b>
 <div id="eo"><label>Observation start date</label><input id="eos" type="date"><label>Observation days</label><input id="eod" type="number" min="3" max="90"></div>
 <div id="ep"><label>Current phase: daily limit</label><input id="epl" type="number" min="0"><label>Current phase: days (0 = ongoing)</label><input id="epd" type="number" min="0"><label>Current phase: start date</label><input id="eps" type="date"></div>
 <label>Reason (required)</label><input id="erz" maxlength="80"><div class="sub" id="ee" style="color:var(--warn)"></div>
 <div class="stk"><button class="btn p" id="esv">Save changes</button><button class="btn" id="ero">Reopen observation</button><button class="btn d" id="edl">Delete all data</button><button class="btn" id="ecl">Close</button></div></dialog>
<dialog id="dlg">
  <b id="mt"></b>
  <label>When did you smoke it?</label>
  <input id="mi" type="datetime-local">
  <label>What was happening? (optional)</label><select id="mx"></select>
  <label>Mood or urge (optional)</label><select id="mm"></select>
  <div class="row" style="margin:16px 0 0">
    <button class="btn d" id="md">Delete</button>
    <button class="btn" id="mc">Cancel</button>
    <button class="btn p" id="ms">Save</button>
  </div>
</dialog>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let db,S={ev:[],conf:{},cfg:{cut:4,base:10,pack:20,price:0,cur:'₹',lastExp:0}},M=null,lastId=null,tT,CB=null,GR=14;

/* ---- storage (IndexedDB) ---- */
const tx=(s,m,f)=>new Promise((res,rej)=>{const t=db.transaction(s,m),o=f(t.objectStore(s));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error)});
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('smokeless',1);r.onupgradeneeded=()=>{r.result.createObjectStore('ev',{keyPath:'id',autoIncrement:true});r.result.createObjectStore('kv')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kset=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));
const load=async()=>{S.ev=await tx('ev','readonly',s=>s.getAll());S.conf=(await tx('kv','readonly',s=>s.get('conf')))||{};Object.assign(S.cfg,await tx('kv','readonly',s=>s.get('cfg')));S.obs=(await tx('kv','readonly',s=>s.get('obs')))||null;S.att=(await tx('kv','readonly',s=>s.get('att')))||[];S.adj=(await tx('kv','readonly',s=>s.get('adj')))||[]};

/* ---- time helpers ---- */
const offNow=t=>-new Date(t||Date.now()).getTimezoneOffset();
const dk=(t,off)=>new Date(t+off*6e4-S.cfg.cut*36e5).toISOString().slice(0,10);
const todayK=()=>dk(Date.now(),offNow());
const hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const lab=k=>new Date(k+'T12:00:00').toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'});
const loc=t=>new Date(t-new Date(t).getTimezoneOffset()*6e4).toISOString().slice(0,16);
const cigs=()=>S.ev.filter(e=>e.type==='cig');
const byDay=()=>{const m={};cigs().forEach(e=>{const k=dk(e.t,e.off);m[k]=(m[k]||0)+1});return m};
const cpc=()=>S.cfg.price>0&&S.cfg.pack>0?S.cfg.price/S.cfg.pack:0;
const money=v=>S.cfg.cur+Math.abs(v).toFixed(0);

/* ---- actions ---- */
async function add(e){e.entered=Date.now();const id=await tx('ev','readwrite',s=>s.add(e));e.id=id;S.ev.push(e);return id}
async function upd(e){await tx('ev','readwrite',s=>s.put(e))}
async function rem(id){await tx('ev','readwrite',s=>s.delete(id));S.ev=S.ev.filter(e=>e.id!==id)}
function toast(msg,undo,cx){clearTimeout(tT);$('#tmsg').textContent=msg;$('#tund').hidden=!undo;$('#tund').onclick=undo||null;$('#tctx').hidden=!cx;$('#tctx').onclick=cx||null;$('#toast').classList.add('on');tT=setTimeout(()=>$('#toast').classList.remove('on'),5000)}
function dl(name,type,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function openM(ev,title){M=ev;$('#mx').value=ev.ctx||'';$('#mm').value=ev.mood||'';$('#mt').textContent=title;$('#mi').value=loc(ev.t);$('#md').hidden=!ev.id;$('#dlg').showModal()}

const A={
 async log(){const t=Date.now(),id=await add({t,off:offNow(t),type:'cig',back:false});CB=id;render();toast('Logged at '+hm(t),async()=>{await rem(id);render();toast('Removed')},()=>{$('#toast').classList.remove('on');openM({...S.ev.find(x=>x.id===id)},'Add context')})},
 back(){openM({t:Date.now(),off:offNow(),type:'cig',back:true},'Add a missed cigarette')},
 async crave(){const t=Date.now(),id=await add({t,off:offNow(t),type:'crave'});render();toast('Craving resisted. Well done.',async()=>{await rem(id);render()})},
 async confirm(){const k=this.dataset.k;S.conf[k]=true;await kset('conf',S.conf);render()},
 exp(){const o={v:1,exported:new Date().toISOString(),cfg:S.cfg,conf:S.conf,obs:S.obs,att:S.att,adj:S.adj,ev:S.ev};S.cfg.lastExp=Date.now();kset('cfg',S.cfg);dl('smokeless-'+todayK()+'.json','application/json',JSON.stringify(o,null,1));render()},
 csv(){const r=['id,time,type,backdated'].concat(S.ev.map(e=>[e.id,new Date(e.t).toISOString(),e.type,!!e.back].join(',')));dl('smokeless-'+todayK()+'.csv','text/csv',r.join('\n'))},
 imp(){$('#file').click()},
 async obsStart(){const n=Math.min(60,Math.max(3,+$('#od').value||7));S.obs={start:todayK(),days:n,done:false};await kset('obs',S.obs);render();toast('Observation started for '+n+' days')},
 async obsDone(){const o=S.obs,tk=todayK(),bd=byDay(),ks=Object.keys(S.conf).filter(k=>S.conf[k]&&k>=o.start&&k<tk),we=ks.some(k=>[0,6].includes(new Date(k+'T12:00:00').getDay()));
  const msg=(ks.length<5||!we?'Only '+ks.length+' confirmed day'+(ks.length===1?'':'s')+(we?'':' and no weekend day')+' so far, so your pattern may be unreliable. ':'')+'Complete observation now?';
  if(!confirm(msg))return;o.done=true;o.doneAt=Date.now();o.baseline=ks.length?ks.reduce((t,k)=>t+(bd[k]||0),0)/ks.length:null;await kset('obs',o);render();toast('Observation complete')},
 async planGo(){const a=Math.max(0,+$('#p0').value||0),d=Math.max(3,+$('#pd').value||7);await startA(a,a?d:0)},
 async phaseGo(){const a=att(),na=Math.max(0,+$('#na').value||0),nd=na?Math.max(3,+$('#nd').value||7):0;await endA(na<a.allow?'advanced':na===a.allow?'repeated':'adjusted up');await startA(na,nd,a.id)},
 async phaseRep(){const a=att();await endA('repeated');await startA(a.allow,a.days,a.id)},
 async phaseBack(){const a=att(),v=S.att.slice(0,-1).reverse().find(x=>x.allow>a.allow);if(!v)return;await endA('rolled back');await startA(v.allow,v.days||7,a.id)},
 async relKeep(){att().rd=todayK();await kset('att',S.att);render()},
 async fb(){const r=this.dataset.r;if(r)S.adj.push({t:Date.now(),txt:'You noted: '+r});S.cfg.fbT=Date.now();await kset('cfg',S.cfg);await kset('adj',S.adj);render()},
 pObs(){const o=S.obs,tk=todayK(),x=dd(o.start,tk)+1,bd=byDay(),ks=Object.keys(S.conf).filter(k=>S.conf[k]&&k>=o.start&&k<tk),we=ks.some(k=>[0,6].includes(new Date(k+'T12:00:00').getDay()));
  pop('Observation',`<div class="sub">Day ${Math.min(x,o.days)} of ${o.days} · ${ks.length} confirmed day${ks.length===1?'':'s'}.${ks.length<5||!we?' Your pattern may still be unreliable (it needs 5+ confirmed days including a weekend).':''}</div><label>Extend by (days)</label><input id="ex" type="number" min="1" max="30" value="3">`,
  [['Complete observation','p',async r=>{o.done=true;o.doneAt=Date.now();o.baseline=ks.length?ks.reduce((t,k)=>t+(bd[k]||0),0)/ks.length:null;await kset('obs',o);await logAdj('Observation completed. Reason: '+r)}],
   ['Extend observation','',async r=>{const n=Math.max(1,+$('#ex').value||3);o.days+=n;await kset('obs',o);await logAdj('Observation extended by '+n+' days. Reason: '+r)}]])},
 pPhase(){const a=att(),tk=todayK(),c=score(a,tk),x=dd(a.start,tk)+1,due=a.days>0&&x>a.days,pv=S.att.slice(0,-1).reverse().find(v=>v.allow>a.allow),rec=due&&c.pct!=null&&c.pct>=80?Math.max(0,a.allow-Math.max(1,Math.round(a.allow*.1))):a.allow;
  pop(due?'Phase complete':'Manage this phase',`<div class="sub">${c.pct==null?'No confirmed days yet.':'Consumption '+c.pct+'% ('+c.ok+' of '+c.el+' days)'+(c.adh!=null?' · Schedule '+c.adh+'%':'')}</div>${due?'<div class="sub">'+(c.pct==null?'Confirm past days first.':c.pct>=80?'80% or better, so a lower limit is suggested.':'Under 80%, so repeating is suggested.')+'</div>':''}<label>Daily limit</label><input id="na" type="number" min="0" value="${rec}"><label>Days</label><input id="nd" type="number" min="3" value="${a.days||7}">`,
  [['Apply these numbers','p',async r=>{const na=Math.max(0,+$('#na').value||0),nd=na?Math.max(3,+$('#nd').value||7):0;await endA(na<a.allow?'advanced':na===a.allow?'repeated':'adjusted up',r);await startA(na,nd,a.id)}],
   ['Repeat this phase','',async r=>{await endA('repeated',r);await startA(a.allow,a.days,a.id)}]].concat(pv?[['Go back to limit '+pv.allow,'',async r=>{await endA('rolled back',r);await startA(pv.allow,pv.days||7,a.id)}]]:[]))},
 async undo(){const e=S.ev.reduce((m,x)=>!m||(x.entered||x.t)>(m.entered||m.t)?x:m,null);if(!e)return;await rem(e.id);if(CB===e.id)CB=null;render();toast('Removed '+(e.type==='cig'?'cigarette':'craving')+' from '+hm(e.t))},
 cbDone(){CB=null;render()},
 edit(){const o=S.obs,a=att();$('#ee').textContent='';$('#erz').value='';$('#eo').hidden=!o;$('#ep').hidden=!a;$('#ero').hidden=!(o&&o.done);if(o){$('#eos').value=o.start;$('#eod').value=o.days}if(a){$('#epl').value=a.allow;$('#epd').value=a.days;$('#eps').value=a.start}$('#edlg').showModal()},
 async wipe(){if(!confirm('Delete every record on this phone? This cannot be undone. Export first if unsure.'))return;await tx('ev','readwrite',s=>s.clear());await kset('conf',{});await kset('obs',null);S.obs=null;await kset('att',[]);S.att=[];await kset('adj',[]);S.adj=[];S.ev=[];S.conf={};render();toast('All data deleted')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a].call(b);const n=e.target.closest('[data-t]');if(n)show(n.dataset.t);const g=e.target.closest('[data-g]');if(g){GR=+g.dataset.g;render()}const cx=e.target.closest('[data-cx],[data-mm]');if(cx&&CB){const v=S.ev.find(z=>z.id===CB);if(v){const isC=cx.dataset.cx!==undefined,k=isC?'ctx':'mood',val=isC?cx.dataset.cx:cx.dataset.mm;v[k]=v[k]===val?'':val;upd(v).then(render)}}const i=e.target.closest('[data-id]');if(i){const ev=S.ev.find(x=>x.id==i.dataset.id);if(ev)openM({...ev},'Edit time')}});

$('#mc').onclick=()=>$('#dlg').close();
$('#ms').onclick=async()=>{const t=new Date($('#mi').value).getTime();if(!t||t>Date.now()+6e4){toast('Pick a time that has already passed');return}
 const was=M.t;M.t=t;M.ctx=$('#mx').value;M.mood=$('#mm').value;M.off=offNow(t);if(M.id){if(Math.abs(t-was)>12e4)M.back=true;await upd(M);const i=S.ev.findIndex(x=>x.id===M.id);S.ev[i]=M}else await add(M);
 $('#dlg').close();render();toast('Saved')};
$('#md').onclick=async()=>{await rem(M.id);$('#dlg').close();render();toast('Deleted')};

$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const o=JSON.parse(await f.text());if(!Array.isArray(o.ev)||o.ev.some(x=>typeof x.t!=='number'||!x.type))throw 0;
  if(!confirm('Replace all current data with '+o.ev.length+' records from this backup?'))return;
  await tx('ev','readwrite',s=>{s.clear();o.ev.forEach(x=>s.put(x))});await kset('conf',o.conf||{});await kset('obs',o.obs||null);await kset('att',o.att||[]);await kset('adj',o.adj||[]);Object.assign(S.cfg,o.cfg||{});await kset('cfg',S.cfg);await load();render();toast('Backup restored')}
 catch{toast('That file is not a valid SmokeLess backup')}};

['cut','base','pack','price'].forEach(k=>$('#s-'+k).onchange=async e=>{S.cfg[k]=Math.max(0,+e.target.value||0);await kset('cfg',S.cfg);render()});
