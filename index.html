<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b0a">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>SmokeLess</title>
<style>
:root{color-scheme:dark;--bg:#050b0a;--card:#0b1311;--btn:#28332d;--ink:#f1f5f2;--mut:#9aa89f;--line:#2f3b35;--acc:#4a7c4f;--hi:#8fd19a;--accink:#fff;--soft:#17261d;--warn:#e0a458;--sh:none;--serif:ui-serif,Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);padding-top:env(safe-area-inset-top)}
main{max-width:520px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font:600 15px var(--sans);margin:0;color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--sh);margin-bottom:14px;border:1px solid var(--line)}
.hero{text-align:center;padding:26px 18px 20px}
.num{font:400 112px/1 var(--serif);letter-spacing:-3px}
.sub{color:var(--mut);margin-top:4px}
.strip{position:relative;height:30px;margin:20px 6px 4px;border-bottom:2px solid var(--line)}
.tick{position:absolute;bottom:0;width:4px;height:22px;border-radius:3px;background:var(--hi);transform:translateX(-2px)}
.tick.b{opacity:.45}
.scale{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin:0 6px}
.log{display:block;width:100%;border:0;border-radius:26px;background:var(--acc);color:var(--accink);font:600 22px var(--sans);padding:26px;margin:4px 0 12px;box-shadow:0 10px 24px -10px var(--acc)}
.log:active{transform:scale(.98)}
.row{display:flex;gap:10px;margin-bottom:14px}
.btn{flex:1;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:16px;padding:14px;font:500 15px var(--sans)}
.btn.p{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.d{color:var(--warn)}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--hi)}
.chip.w{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.cf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.cf .btn{flex:0 0 auto;padding:10px 14px}
.stat{display:flex;justify-content:space-between;padding:8px 0}
.stat b{font-weight:600}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:14px}
input{width:100%;font:16px var(--sans);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:500 14px var(--sans);padding:16px 0}
nav button.on{color:var(--hi);font-weight:700}
dialog{border:0;border-radius:22px;padding:20px;background:var(--card);color:var(--ink);width:min(92vw,400px)}
dialog::backdrop{background:rgba(5,15,20,.55)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:488px;margin:auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:13px 16px;display:flex;justify-content:space-between;gap:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1;pointer-events:auto}
#toast button{background:none;border:0;color:inherit;font:700 15px var(--sans);text-decoration:underline}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--hi)}.hist{display:flex;align-items:flex-end;gap:2px;height:70px;margin-top:12px}.hist i{flex:1;background:var(--hi);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
nav button.dot::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
.hero{transition:background .3s}.st{margin-top:10px;font-weight:600}.hero.g{background:#102a1b;border-color:#3a7d51}.hero.a{background:#2a2111;border-color:#8a6a24}.hero.r{background:#2c1614;border-color:#9a4a42}.stk{display:flex;flex-direction:column;gap:8px;margin-top:12px}.stk .btn{flex:none}
select{width:100%;font:16px var(--sans);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--ink)}
[hidden]{display:none!important}
.empty{color:var(--mut);text-align:center;padding:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="top"><h1>SmokeLess</h1><span id="date" class="sub"></span></div>

<section id="v-today">
  <div id="obsc"></div>
  <div id="pend"></div>
  <div class="card hero" id="hero">
    <div class="num" id="cnt">0</div>
    <div class="sub" id="cntsub">cigarettes today</div>
    <div class="st" id="st"></div>
    <div class="strip" id="strip"></div>
    <div class="scale"><span>4 am</span><span>10 am</span><span>4 pm</span><span>10 pm</span><span>4 am</span></div>
  </div>
  <button class="log" data-a="log">Log cigarette</button>
  <div class="row">
    <button class="btn" data-a="back">Add missed</button>
    <button class="btn" data-a="crave">Craving resisted <span class="chip" id="crv">0</span></button>
  </div>
  <div class="card list" id="tlist"></div>
</section>

<section id="v-hist" hidden>
  <div class="card" id="wk" hidden></div>
  <div class="card" id="sum"></div>
  <div class="card" id="pat"></div>
  <div class="card list" id="aj" hidden></div>
  <div class="card list" id="ph" hidden></div>
  <div class="card list" id="hlist"></div>
</section>

<section id="v-set" hidden>
  <div class="card">
    <label>Day starts at (hour, 0 to 8)</label><input id="s-cut" type="number" min="0" max="8">
    <label>Cigarettes per day before you started (estimate)</label><input id="s-base" type="number" min="0">
    <label>Cigarettes per pack</label><input id="s-pack" type="number" min="1">
    <label>Price per pack</label><input id="s-price" type="number" min="0" step="0.01">
    <label>Currency symbol</label><input id="s-cur" maxlength="3">
    <label>Usual wake time (optional)</label><input id="s-wk" type="time">
    <label>Usual sleep time (optional)</label><input id="s-sl" type="time">
  </div>
  <div class="card">
    <b>Backup</b><p class="sub" id="lastexp" style="margin:4px 0 12px"></p>
    <div class="row"><button class="btn" data-a="exp">Export JSON</button><button class="btn" data-a="csv">Export CSV</button></div>
    <button class="btn" style="width:100%" data-a="imp">Restore from backup</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <p class="sub">Your data lives only in this browser on this phone. Export weekly.</p>
    <button class="btn d" style="width:100%" data-a="wipe">Delete all data</button>
  </div>
</section>
</main>

<nav>
  <button class="on" data-t="today">Today</button>
  <button data-t="hist">Days</button>
  <button data-t="set">Settings</button>
</nav>

<div id="toast"><span id="tmsg"></span><button id="tctx" hidden>Context</button><button id="tund" hidden>Undo</button></div>

<dialog id="dlg">
  <b id="mt"></b>
  <label>When did you smoke it?</label>
  <input id="mi" type="datetime-local">
  <label>What was happening? (optional)</label><select id="mx"></select>
  <label>Mood or urge (optional)</label><select id="mm"></select>
  <div class="row" style="margin:16px 0 0">
    <button class="btn d" id="md">Delete</button>
    <button class="btn" id="mc">Cancel</button>
    <button class="btn p" id="ms">Save</button>
  </div>
</dialog>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let db,S={ev:[],conf:{},cfg:{cut:4,base:10,pack:20,price:0,cur:'₹',lastExp:0}},M=null,lastId=null,tT;

/* ---- storage (IndexedDB) ---- */
const tx=(s,m,f)=>new Promise((res,rej)=>{const t=db.transaction(s,m),o=f(t.objectStore(s));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error)});
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('smokeless',1);r.onupgradeneeded=()=>{r.result.createObjectStore('ev',{keyPath:'id',autoIncrement:true});r.result.createObjectStore('kv')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kset=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));
const load=async()=>{S.ev=await tx('ev','readonly',s=>s.getAll());S.conf=(await tx('kv','readonly',s=>s.get('conf')))||{};Object.assign(S.cfg,await tx('kv','readonly',s=>s.get('cfg')));S.obs=(await tx('kv','readonly',s=>s.get('obs')))||null;S.att=(await tx('kv','readonly',s=>s.get('att')))||[];S.adj=(await tx('kv','readonly',s=>s.get('adj')))||[]};

/* ---- time helpers ---- */
const offNow=t=>-new Date(t||Date.now()).getTimezoneOffset();
const dk=(t,off)=>new Date(t+off*6e4-S.cfg.cut*36e5).toISOString().slice(0,10);
const todayK=()=>dk(Date.now(),offNow());
const hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const lab=k=>new Date(k+'T12:00:00').toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'});
const loc=t=>new Date(t-new Date(t).getTimezoneOffset()*6e4).toISOString().slice(0,16);
const cigs=()=>S.ev.filter(e=>e.type==='cig');
const byDay=()=>{const m={};cigs().forEach(e=>{const k=dk(e.t,e.off);m[k]=(m[k]||0)+1});return m};
const cpc=()=>S.cfg.price>0&&S.cfg.pack>0?S.cfg.price/S.cfg.pack:0;
const money=v=>S.cfg.cur+Math.abs(v).toFixed(0);

/* ---- actions ---- */
async function add(e){e.entered=Date.now();const id=await tx('ev','readwrite',s=>s.add(e));e.id=id;S.ev.push(e);return id}
async function upd(e){await tx('ev','readwrite',s=>s.put(e))}
async function rem(id){await tx('ev','readwrite',s=>s.delete(id));S.ev=S.ev.filter(e=>e.id!==id)}
function toast(msg,undo,cx){clearTimeout(tT);$('#tmsg').textContent=msg;$('#tund').hidden=!undo;$('#tund').onclick=undo||null;$('#tctx').hidden=!cx;$('#tctx').onclick=cx||null;$('#toast').classList.add('on');tT=setTimeout(()=>$('#toast').classList.remove('on'),5000)}
function dl(name,type,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function openM(ev,title){M=ev;$('#mx').value=ev.ctx||'';$('#mm').value=ev.mood||'';$('#mt').textContent=title;$('#mi').value=loc(ev.t);$('#md').hidden=!ev.id;$('#dlg').showModal()}

const A={
 async log(){const t=Date.now(),id=await add({t,off:offNow(t),type:'cig',back:false});render();toast('Logged at '+hm(t),async()=>{await rem(id);render();toast('Removed')},()=>{$('#toast').classList.remove('on');openM({...S.ev.find(x=>x.id===id)},'Add context')})},
 back(){openM({t:Date.now(),off:offNow(),type:'cig',back:true},'Add a missed cigarette')},
 async crave(){const t=Date.now(),id=await add({t,off:offNow(t),type:'crave'});render();toast('Craving resisted. Well done.',async()=>{await rem(id);render()})},
 async confirm(){const k=this.dataset.k;S.conf[k]=true;await kset('conf',S.conf);render()},
 exp(){const o={v:1,exported:new Date().toISOString(),cfg:S.cfg,conf:S.conf,obs:S.obs,att:S.att,adj:S.adj,ev:S.ev};S.cfg.lastExp=Date.now();kset('cfg',S.cfg);dl('smokeless-'+todayK()+'.json','application/json',JSON.stringify(o,null,1));render()},
 csv(){const r=['id,time,type,backdated'].concat(S.ev.map(e=>[e.id,new Date(e.t).toISOString(),e.type,!!e.back].join(',')));dl('smokeless-'+todayK()+'.csv','text/csv',r.join('\n'))},
 imp(){$('#file').click()},
 async obsStart(){const n=Math.min(60,Math.max(3,+$('#od').value||7));S.obs={start:todayK(),days:n,done:false};await kset('obs',S.obs);render();toast('Observation started for '+n+' days')},
 async obsDone(){const o=S.obs,tk=todayK(),bd=byDay(),ks=Object.keys(S.conf).filter(k=>S.conf[k]&&k>=o.start&&k<tk),we=ks.some(k=>[0,6].includes(new Date(k+'T12:00:00').getDay()));
  const msg=(ks.length<5||!we?'Only '+ks.length+' confirmed day'+(ks.length===1?'':'s')+(we?'':' and no weekend day')+' so far, so your pattern may be unreliable. ':'')+'Complete observation now?';
  if(!confirm(msg))return;o.done=true;o.doneAt=Date.now();o.baseline=ks.length?ks.reduce((t,k)=>t+(bd[k]||0),0)/ks.length:null;await kset('obs',o);render();toast('Observation complete')},
 async planGo(){const a=Math.max(0,+$('#p0').value||0),d=Math.max(3,+$('#pd').value||7);await startA(a,a?d:0)},
 async phaseGo(){const a=att(),na=Math.max(0,+$('#na').value||0),nd=na?Math.max(3,+$('#nd').value||7):0;await endA(na<a.allow?'advanced':na===a.allow?'repeated':'adjusted up');await startA(na,nd,a.id)},
 async phaseRep(){const a=att();await endA('repeated');await startA(a.allow,a.days,a.id)},
 async phaseBack(){const a=att(),v=S.att.slice(0,-1).reverse().find(x=>x.allow>a.allow);if(!v)return;await endA('rolled back');await startA(v.allow,v.days||7,a.id)},
 async relKeep(){att().rd=todayK();await kset('att',S.att);render()},
 async fb(){const r=this.dataset.r;if(r)S.adj.push({t:Date.now(),txt:'You noted: '+r});S.cfg.fbT=Date.now();await kset('cfg',S.cfg);await kset('adj',S.adj);render()},
 async wipe(){if(!confirm('Delete every record on this phone? This cannot be undone. Export first if unsure.'))return;await tx('ev','readwrite',s=>s.clear());await kset('conf',{});await kset('obs',null);S.obs=null;await kset('att',[]);S.att=[];await kset('adj',[]);S.adj=[];S.ev=[];S.conf={};render();toast('All data deleted')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a].call(b);const n=e.target.closest('[data-t]');if(n)show(n.dataset.t);const i=e.target.closest('[data-id]');if(i){const ev=S.ev.find(x=>x.id==i.dataset.id);if(ev)openM({...ev},'Edit time')}});

$('#mc').onclick=()=>$('#dlg').close();
$('#ms').onclick=async()=>{const t=new Date($('#mi').value).getTime();if(!t||t>Date.now()+6e4){toast('Pick a time that has already passed');return}
 const was=M.t;M.t=t;M.ctx=$('#mx').value;M.mood=$('#mm').value;M.off=offNow(t);if(M.id){if(Math.abs(t-was)>12e4)M.back=true;await upd(M);const i=S.ev.findIndex(x=>x.id===M.id);S.ev[i]=M}else await add(M);
 $('#dlg').close();render();toast('Saved')};
$('#md').onclick=async()=>{await rem(M.id);$('#dlg').close();render();toast('Deleted')};

$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const o=JSON.parse(await f.text());if(!Array.isArray(o.ev)||o.ev.some(x=>typeof x.t!=='number'||!x.type))throw 0;
  if(!confirm('Replace all current data with '+o.ev.length+' records from this backup?'))return;
  await tx('ev','readwrite',s=>{s.clear();o.ev.forEach(x=>s.put(x))});await kset('conf',o.conf||{});await kset('obs',o.obs||null);await kset('att',o.att||[]);await kset('adj',o.adj||[]);Object.assign(S.cfg,o.cfg||{});await kset('cfg',S.cfg);await load();render();toast('Backup restored')}
 catch{toast('That file is not a valid SmokeLess backup')}};

['cut','base','pack','price'].forEach(k=>$('#s-'+k).onchange=async e=>{S.cfg[k]=Math.max(0,+e.target.value||0);await kset('cfg',S.cfg);render()});
$('#s-cur').onchange=async e=>{S.cfg.cur=e.target.value||'₹';await kset('cfg',S.cfg);render()};

const CX=['Work break','Social','After a meal','Tea or coffee','Stress','Boredom','Commute','Other'],MD=['Strong craving','Stressed','Bored','Calm','Low'];
$('#mx').innerHTML='<option value="">Skip</option>'+CX.map(x=>`<option>${x}</option>`).join('');$('#mm').innerHTML='<option value="">Skip</option>'+MD.map(x=>`<option>${x}</option>`).join('');
[['wk','wake'],['sl','sleep']].forEach(([i,k])=>$('#s-'+i).onchange=async e=>{S.cfg[k]=e.target.value;await kset('cfg',S.cfg);render()});
function show(t){['today','hist','set'].forEach(x=>$('#v-'+x).hidden=x!==t);$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));scrollTo(0,0)}

/* ---- render ---- */
function pending(){const c=cigs();if(!c.length)return[];const f=c.reduce((a,b)=>b.t<a.t?b:a),fk=dk(f.t,f.off),d=new Date(todayK()+'T12:00:00Z'),out=[];
 for(let i=0;i<60&&out.length<7;i++){d.setUTCDate(d.getUTCDate()-1);const k=d.toISOString().slice(0,10);if(k<fk)break;if(!S.conf[k])out.push(k)}return out}

const dd=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
let oH='';
function obsUI(tk){const o=S.obs;let h;
 if(!o)h='<div class="card"><b>Start observation</b><div class="sub">First, SmokeLess only watches your pattern. No limits, no targets. How many days should it observe?</div><div class="cf"><input id="od" type="number" min="3" max="60" value="7" style="max-width:90px"><button class="btn p" data-a="obsStart">Start observing</button></div></div>';
 else if(!o.done){const x=dd(o.start,tk)+1,over=x>o.days,end=new Date(Date.parse(o.start)+(o.days-1)*864e5).toISOString().slice(0,10);
  h=`<div class="card"><b>Observation · day ${Math.min(x,o.days)} of ${o.days}</b><div class="bar"><i style="width:${Math.round(Math.min(x,o.days)/o.days*100)}%"></i></div><div class="sub">${over?'The period is over. Complete it to set your baseline.':'Ends '+lab(end)+'. No limit applies yet.'}</div><div class="row" style="margin:12px 0 0"><button class="btn${over?' p':''}" data-a="obsDone">${over?'Complete observation':'Complete early'}</button></div></div>`}
 else h=redUI(tk);
 if(h!==oH){oH=h;$('#obsc').innerHTML=h}}
function pat(){const c=cigs().sort((a,b)=>a.t-b.t);if(c.length<3)return'<b>Your pattern</b><div class="sub">Log a few cigarettes and your pattern will appear here.</div>';
 const hr=Array(24).fill(0);c.forEach(e=>hr[new Date(e.t+e.off*6e4).getUTCHours()]++);
 const mx=Math.max(...hr);let bs=0,bi=0;for(let i=0;i<24;i++){const t=hr[i]+hr[(i+1)%24]+hr[(i+2)%24];if(t>bs){bs=t;bi=i}}
 const g=[];for(let i=1;i<c.length;i++)if(dk(c[i].t,c[i].off)===dk(c[i-1].t,c[i-1].off))g.push((c[i].t-c[i-1].t)/6e4);g.sort((a,b)=>a-b);const md=g.length?g[g.length>>1]:0;
 const f=h=>((h%12)||12)+(h%24<12?' am':' pm'),nc=Object.keys(S.conf).filter(k=>S.conf[k]).length;
 return `<b>Your pattern</b>${nc<5?'<div class="sub">Based on only '+nc+' confirmed day'+(nc===1?'':'s')+'. Treat it as rough.</div>':''}<div class="hist">${hr.map(v=>`<i style="height:${v/mx*100}%"></i>`).join('')}</div><div class="scale" style="margin:4px 0 12px"><span>12 am</span><span>6 am</span><span>12 pm</span><span>6 pm</span><span>12 am</span></div><div class="stat"><span>Busiest stretch</span><b>${f(bi)} to ${f(bi+3)}</b></div>`+(md?`<div class="stat"><span>Typical gap</span><b>${Math.floor(md/60)}h ${Math.round(md%60)}m</b></div>`:'')}
const nb=()=>S.obs&&S.obs.baseline!=null?S.obs.baseline:S.cfg.base;
const att=()=>{const a=S.att[S.att.length-1];return a&&!a.end?a:null};
const addD=(k,n)=>new Date(Date.parse(k)+n*864e5).toISOString().slice(0,10);
const pre=a=>cigs().filter(e=>dk(e.t,e.off)<a.start).sort((x,y)=>x.t-y.t);
function gapMin(a){const c=pre(a),g=[];for(let i=1;i<c.length;i++)if(dk(c[i].t,c[i].off)===dk(c[i-1].t,c[i-1].off))g.push((c[i].t-c[i-1].t)/6e4);g.sort((x,y)=>x-y);return g.length?g[g.length>>1]:90}
function firstMed(a){const f={};pre(a).forEach(e=>{const k=dk(e.t,e.off);if(!f[k])f[k]=e});const m=Object.values(f).map(e=>{const d=new Date(e.t+e.off*6e4);return(d.getUTCHours()*60+d.getUTCMinutes()-S.cfg.cut*60+1440)%1440}).sort((x,y)=>x-y);return m.length?m[m.length>>1]:300}
function shiftFor(a,i,gap){const days={};cigs().forEach(e=>{const k=dk(e.t,e.off);if(k>=a.start)(days[k]=days[k]||[]).push(e)});let early=0;Object.keys(days).sort().slice(-7).forEach(k=>{const c=days[k].sort((x,y)=>x.t-y.t);if(c[i]&&c[i-1]&&c[i].t<c[i-1].t+(gap-30)*6e4)early++});return -Math.min(60,15*Math.floor(early/3))}
const ds=tk=>Date.parse(tk+'T00:00:00Z')+S.cfg.cut*36e5-offNow()*6e4,tmin=h=>{const[x,y]=h.split(':');return(+x*60+ +y-S.cfg.cut*60+1440)%1440};
function nextWin(a,tk){if(a.allow<=0)return null;const td=cigs().filter(e=>dk(e.t,e.off)===tk).sort((x,y)=>x.t-y.t),i=td.length;let t;
 if(!i)t=Math.max(ds(tk)+firstMed(a)*6e4,S.cfg.wake?ds(tk)+tmin(S.cfg.wake)*6e4:0);else{const g=gapMin(a)*nb()/a.allow;t=td[i-1].t+(g+shiftFor(a,i,g))*6e4}
 return{s:t-18e5,e:t+18e5}}
function stat(a,n,tk){const now=Date.now();
 if(n>a.allow)return{c:'r',t:a.allow?(n-a.allow)+' over today\'s limit. Logging stays open.':'A slip. Tomorrow starts fresh.'};
 if(!a.allow)return{c:'g',t:'Smoke-free so far today'};
 if(n===a.allow)return{c:'a',t:'At today\'s limit. No more windows today.'};
 const w=nextWin(a,tk);if(S.cfg.sleep&&w.e>ds(tk)+tmin(S.cfg.sleep)*6e4)return{c:'a',t:'No more windows today'};if(now<w.s){const m=Math.round((w.s-now)/6e4);return{c:'a',t:'Next window '+hm(w.s)+' to '+hm(w.e)+' · in '+(m>=60?Math.floor(m/60)+'h ':'')+m%60+'m'}}
 return{c:'g',t:now<=w.e?'Window open until '+hm(w.e):'Window open since '+hm(w.s)}}
function score(a,tk){const bd=byDay(),ks=Object.keys(S.conf).filter(k=>S.conf[k]&&k>=a.start&&k<tk&&(!a.endK||k<=a.endK)),ok=ks.filter(k=>(bd[k]||0)<=a.allow).length,gap=a.allow>0?gapMin(a)*nb()/a.allow:0;let t=0,w=0;
 if(gap){const st=new Set(ks),by={};cigs().forEach(e=>{const k=dk(e.t,e.off);if(st.has(k))(by[k]=by[k]||[]).push(e)});Object.values(by).forEach(c=>{c.sort((x,y)=>x.t-y.t);for(let i=1;i<c.length;i++){t++;if(Math.abs(c[i].t-c[i-1].t-gap*6e4)<=18e5)w++}})}
 return{el:ks.length,ok,pct:ks.length?Math.round(ok/ks.length*100):null,adh:t?Math.round(w/t*100):null}}
function adapt(a){if(a.allow<=0)return;a.sh=a.sh||{};let ch=0;const g=gapMin(a)*nb()/a.allow;for(let i=1;i<=Math.min(a.allow,12);i++){const v=shiftFor(a,i,g),o=a.sh[i]||0;if(v!==o){a.sh[i]=v;ch=1;S.adj.push({t:Date.now(),txt:v?'Window '+(i+1)+' now '+Math.abs(v)+' min earlier. You smoked early in that slot on 3+ of the last 7 days.':'Window '+(i+1)+' back to normal. Fewer early cigarettes lately.'})}}if(ch){kset('att',S.att);kset('adj',S.adj)}}
function devN(a){const g=gapMin(a)*nb()/a.allow,d={};cigs().forEach(e=>{const k=dk(e.t,e.off);if(k>=a.start)(d[k]=d[k]||[]).push(e)});let n=0;Object.keys(d).sort().slice(-7).forEach(k=>{const c=d[k].sort((x,y)=>x.t-y.t);for(let i=1;i<c.length;i++)if(c[i].t<c[i-1].t+(g-30)*6e4)n++});return n}
const FB=()=>'<div class="card"><b>Smoking earlier than the windows?</b><div class="sub">Optional: what is behind it? This helps tune your windows.</div><div class="stk">'+['Strong craving','Social','Boredom','Stress','Timing unrealistic'].map(r=>`<button class="btn" data-a="fb" data-r="${r}">${r}</button>`).join('')+'<button class="btn" data-a="fb">Skip</button></div></div>';
function extra(){const bd=byDay(),w={a:[],e:[]};Object.keys(S.conf).filter(k=>S.conf[k]).forEach(k=>w[[0,6].includes(new Date(k+'T12:00:00').getDay())?'e':'a'].push(bd[k]||0));const av=x=>(x.reduce((p,q)=>p+q,0)/x.length).toFixed(1),cc={};cigs().forEach(e=>{if(e.ctx)cc[e.ctx]=(cc[e.ctx]||0)+1});const ct=Object.entries(cc).sort((x,y)=>y[1]-x[1]).slice(0,3);
 return(w.a.length&&w.e.length?`<div class="stat"><span>Weekday average</span><b>${av(w.a)}</b></div><div class="stat"><span>Weekend average</span><b>${av(w.e)}</b></div>`:'')+(ct.length?'<div class="sub" style="margin-top:8px">Most common contexts</div>'+ct.map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join(''):'')}
function weekly(){const bd=byDay(),tk=todayK(),sm=(f,t)=>{let n=0;for(let i=f;i<t;i++)n+=bd[addD(tk,-i)]||0;return n},a=sm(0,7),b=sm(7,14);if(!a&&!b)return'';
 const cr=S.ev.filter(e=>e.type==='crave'&&dd(dk(e.t,e.off),tk)<7).length,cp=cpc(),cc={};S.ev.forEach(e=>{if(e.type==='cig'&&e.ctx&&dd(dk(e.t,e.off),tk)<7)cc[e.ctx]=(cc[e.ctx]||0)+1});const top=Object.entries(cc).sort((x,y)=>y[1]-x[1])[0];
 return`<b>Last 7 days</b><div class="stat"><span>Cigarettes</span><b>${a}</b></div><div class="stat"><span>The 7 days before</span><b>${b}</b></div><div class="stat"><span>Cravings resisted</span><b>${cr}</b></div>`+(cp?`<div class="stat"><span>Estimated spend</span><b>${money(a*cp)}</b></div>`:'')+(top?`<div class="stat"><span>Most common context</span><b>${top[0]}</b></div>`:'')}
async function endA(dec){const rs=($('#rs')||{}).value||'';const a=att(),tk=todayK(),y=addD(tk,-1),l=a.days>0?addD(a.start,a.days-1):y;a.end=Date.now();a.endK=l<y?l:y;const c=score(a,tk);Object.assign(a,{dec,pct:c.pct,ok:c.ok,el:c.el,adh:c.adh,reason:rs});S.adj.push({t:Date.now(),txt:'Limit '+a.allow+': '+dec+(rs?'. Reason: '+rs:'')});await kset('adj',S.adj)}
async function startA(allow,days,link){S.att.push({id:Date.now(),allow,days,start:todayK(),end:null,n:S.att.filter(x=>x.allow===allow).length+1,link});await kset('att',S.att);render()}
function redUI(tk){const a=att(),B=nb();
 if(!a){const p0=Math.max(1,Math.round(B)-Math.max(1,Math.round(B*.1)));return`<div class="card"><b>Your reduction plan</b><div class="sub">Baseline: ${B.toFixed(1)} a day. Each phase has a daily limit, which is a ceiling and never a target. Every step needs your approval.</div><label>First daily limit</label><input id="p0" type="number" min="0" value="${p0}"><label>Days per phase (minimum 3)</label><input id="pd" type="number" min="3" value="7"><div class="row" style="margin:14px 0 0"><button class="btn p" data-a="planGo">Approve and start</button></div></div>`}
 const x=dd(a.start,tk)+1,c=score(a,tk),bd=byDay(),due=a.days>0&&x>a.days,sc=c.pct==null?'No confirmed days yet.':`Consumption ${c.pct}% (${c.ok} of ${c.el} days)`+(c.adh!=null?` · Schedule ${c.adh}%`:'');
 const rel=[1,2,3].every(i=>{const k=addD(tk,-i);return S.conf[k]&&k>=a.start&&(bd[k]||0)>a.allow})&&a.rd!==tk,pv=S.att.slice(0,-1).reverse().find(v=>v.allow>a.allow);
 if(due){const rec=c.pct!=null&&c.pct>=80?Math.max(0,a.allow-Math.max(1,Math.round(a.allow*.1))):a.allow;
  return`<div class="card"><b>Phase complete</b><div class="sub">${sc}</div><div class="sub">${c.pct==null?'Confirm your past days to get a recommendation.':c.pct>=80?'80% or better, so a lower limit is suggested.':'Under 80%, so repeating the phase is suggested.'} Your call.</div><label>Next daily limit</label><input id="na" type="number" min="0" value="${rec}"><label>Days</label><input id="nd" type="number" min="3" value="${a.days}"><label>Reason (optional)</label><input id="rs" maxlength="80"><div class="stk"><button class="btn p" data-a="phaseGo">Start with these numbers</button><button class="btn" data-a="phaseRep">Repeat this phase</button>${pv?'<button class="btn" data-a="phaseBack">Go back to limit '+pv.allow+'</button>':''}</div></div>`}
 return((a.allow>0&&devN(a)>=3&&Date.now()-(S.cfg.fbT||0)>3*864e5)?FB():'')+(rel?`<div class="card"><b>A few hard days</b><div class="sub">Three confirmed days over the limit. Your progress is safe. What now?</div><div class="stk"><button class="btn" data-a="relKeep">Keep going</button><button class="btn" data-a="phaseRep">Repeat this phase</button>${pv?'<button class="btn" data-a="phaseBack">Go back to limit '+pv.allow+'</button>':''}</div></div>`:'')+`<div class="card"><b>${a.allow?'Limit '+a.allow+' a day':'Smoke-free tracking'}</b><div class="sub">Attempt ${a.n} · ${a.days?'day '+x+' of '+a.days:'ongoing'}</div><div class="sub">${sc}</div></div>`}
function render(){
 const bd=byDay(),tk=todayK(),n=bd[tk]||0,cp=cpc();
 $('#date').textContent=lab(tk);obsUI(tk);
 $('#cnt').textContent=n;
 $('#cntsub').textContent=n===1?'cigarette today':'cigarettes today'+(cp&&n?' · about '+S.cfg.cur+(n*cp).toFixed(0):'');
 const te=S.ev.filter(e=>dk(e.t,e.off)===tk).sort((a,b)=>b.t-a.t),tc=te.filter(e=>e.type==='cig');
 $('#crv').textContent=S.ev.filter(e=>e.type==='crave').length;
 {const a=att(),h=$('#hero');h.className='card hero';$('#st').textContent='';if(a&&S.obs&&S.obs.done){adapt(a);const r=stat(a,n,tk);h.classList.add(r.c);$('#st').textContent=r.t;$('#cntsub').textContent=a.allow?'of '+a.allow+' allowed today'+(n<a.allow?' · '+(a.allow-n)+' left':''):'smoke-free goal today'}}
 $('#strip').innerHTML=tc.map(e=>{const d=new Date(e.t+e.off*6e4),m=((d.getUTCHours()*60+d.getUTCMinutes())-S.cfg.cut*60+1440)%1440;return`<i class="tick${e.back?' b':''}" style="left:${m/14.4}%"></i>`}).join('');
 $('#tlist').innerHTML=tc.length?tc.map(e=>`<div class="it" data-id="${e.id}"><span>${hm(e.t)}</span>${e.back?'<span class="chip w">backdated</span>':'<span class="sub">tap to edit</span>'}</div>`).join(''):'<div class="empty">Nothing logged yet today.</div>';
 const p=pending();
 $('#pend').innerHTML=p.length?`<div class="card"><b>Confirm past days</b><div class="sub">Only confirmed days count toward your progress.</div>`+p.slice(0,3).map(k=>`<div class="cf"><span>${lab(k)} · <b>${bd[k]||0}</b> logged</span><button class="btn p" data-a="confirm" data-k="${k}">${bd[k]?'Confirm':'Yes, zero'}</button></div>`).join('')+(p.length>3?`<div class="sub">${p.length-3} more earlier</div>`:'')+'</div>':'';
 const od=S.ev.length&&Date.now()-S.cfg.lastExp>7*864e5;$('#lastexp').textContent=S.cfg.lastExp?'Last export: '+new Date(S.cfg.lastExp).toLocaleDateString([],{day:'numeric',month:'short'})+(od?'. Time to export again.':''):'Never exported. Export weekly; clearing browser data erases everything.';$$('nav button')[2].classList.toggle('dot',!!od);
 // history
 const base=(S.obs&&S.obs.baseline!=null)?S.obs.baseline:S.cfg.base,cd=Object.keys(S.conf).filter(k=>S.conf[k]&&k<tk),tot=cd.reduce((s,k)=>s+(bd[k]||0),0),avg=cd.length?tot/cd.length:0,sav=cd.reduce((s,k)=>s+(base-(bd[k]||0)),0)*cp;
 $('#sum').innerHTML=`<div class="stat"><span>Confirmed days</span><b>${cd.length}</b></div><div class="stat"><span>Average per confirmed day</span><b>${cd.length?avg.toFixed(1):'–'}</b></div><div class="stat"><span>Cravings resisted</span><b>${S.ev.filter(e=>e.type==='crave').length}</b></div>`+(cp&&cd.length?`<div class="stat"><span>${sav>=0?'Estimated saved':'Estimated extra spend'}</span><b>${money(sav)}</b></div><div class="sub">Estimate from your baseline of ${+base.toFixed(1)} a day and pack price.</div>`:'');
 const d=new Date(tk+'T12:00:00Z'),rows=[];for(let i=0;i<14;i++){const k=d.toISOString().slice(0,10);rows.push(`<div class="it"><span>${lab(k)}</span><span><b>${bd[k]||0}</b> ${k===tk?'<span class="chip">today</span>':S.conf[k]?'<span class="chip">confirmed</span>':'<span class="chip w">incomplete</span>'}</span></div>`);d.setUTCDate(d.getUTCDate()-1)}
 $('#hlist').innerHTML=rows.join('');$('#ph').hidden=!S.att.length;$('#ph').innerHTML='<b>Phases</b>'+S.att.slice().reverse().map(a=>{const c=a.end?a:score(a,todayK());return`<div class="it"><span>Limit ${a.allow} · attempt ${a.n}</span><span>${c.el?c.ok+'/'+c.el+' days':'new'}${a.end?' · '+a.dec:''}</span></div>`}).join('');$('#pat').innerHTML=pat()+extra();{const w=weekly();$('#wk').hidden=!w;$('#wk').innerHTML=w}$('#aj').hidden=!S.adj.length;$('#aj').innerHTML='<b>Adjustment history</b>'+S.adj.slice(-8).reverse().map(x=>`<div class="it" style="display:block"><div>${x.txt}</div><div class="sub">${new Date(x.t).toLocaleDateString([],{day:'numeric',month:'short'})}</div></div>`).join('');
 [['#s-cut',S.cfg.cut],['#s-base',S.cfg.base],['#s-pack',S.cfg.pack],['#s-price',S.cfg.price||''],['#s-cur',S.cfg.cur],['#s-wk',S.cfg.wake||''],['#s-sl',S.cfg.sleep||'']].forEach(([i,v])=>{const el=$(i);if(document.activeElement!==el)el.value=v});
}

(async()=>{db=await openDB();await load();render();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 setInterval(()=>{if(!document.hidden)render()},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()})})();
</script>
